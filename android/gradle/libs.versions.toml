[versions]
# Toolchain
kotlin = "2.4.10"
# Pinned to what the installed Android Studio supports, not to the newest
# release: Studio refuses to open a project whose AGP is ahead of it, and being
# unable to open the project in the IDE is a worse problem than being one
# version behind. Raise this when Studio itself is updated.
agp = "9.2.1"
jvmTarget = "21"
coroutines = "1.11.0"

# AndroidX / Compose — not used by :domain, listed here so the app module in the
# next step has one place to take them from.
composeBom = "2026.08.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"

# Firebase, shared with the iOS app's backend (project `swing-buzz`).
firebaseBom = "34.17.0"
googleServices = "4.5.0"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# Gives `Task<T>.await()`. The Firebase Android SDK returns Play Services Tasks,
# not suspending functions — this is what lets the repository read like the Swift
# one instead of like a pile of completion listeners.
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

compose-bom ={ group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# `:domain` gets kotlin-test from the `kotlin("test")` helper, which picks the
# right variant because that module applies the Kotlin JVM plugin itself. `:app`
# does not — from AGP 9 the Android plugin brings Kotlin along — so the helper has
# no version to resolve there and the dependency is spelled out instead.
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
